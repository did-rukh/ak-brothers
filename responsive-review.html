<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>AK Brothers — Responsive design review</title><style>*{box-sizing:border-box}body{margin:0;font:14px Arial,sans-serif;background:#e9f3fd;color:#083e76}header{padding:18px 22px;background:white;border-bottom:1px solid #c4dced;display:flex;gap:16px;align-items:center;flex-wrap:wrap}h1{font-size:16px;margin:0 auto 0 0}label{font-size:12px}select{border:1px solid #a5cbe6;border-radius:7px;padding:8px;color:#075a96;background:#fff}#stage{margin:20px auto;width:calc(100% - 32px);position:relative;overflow:hidden;background:#fff;box-shadow:0 8px 35px #04315a22;border-radius:9px}iframe{display:block;border:0;transform-origin:top left;width:1440px;height:1000px}p{font-size:11px;text-align:center;padding-inline:20px}a{color:#006ac5}</style></head><body><header><h1>AK Brothers · Design review</h1><label>Screen size <select id="screen-size"><option value="desktop">Desktop · 1440 × 1000</option><option value="tablet">Tablet · 768 × 1024</option><option value="phone">Phone · 390 × 844</option></select></label><label>Page <select id="review-page"><option value="/">Homepage</option><option value="/products/index.html">Products</option><option value="/products/borewell-pumps/index.html">Product detail</option><option value="/borewell-services/index.html">Borewell services</option><option value="/branches/index.html">Branches</option><option value="/contact/index.html">Contact</option></select></label><label><input id="fit-review" type="checkbox" checked> Fit to window</label></header><div id="stage"><iframe id="review-frame" src="/" title="AK Brothers website at the selected screen size" width="1440" height="1000"></iframe></div><p>The website runs inside a frame at the selected size. The frame is scaled to fit this review window. <a href="/" target="_blank" rel="noopener">Open the full website ↗</a></p><script>const frame=document.querySelector('#review-frame');const stage=document.querySelector('#stage');const sizes={desktop:[1440,1000],tablet:[768,1024],phone:[390,844]};function resizeReview(){const [width,height]=sizes[document.querySelector('#screen-size').value];const fitted=document.querySelector('#fit-review').checked;stage.style.width=fitted?'calc(100% - 32px)':width+'px';stage.style.marginLeft=fitted?'auto':'16px';stage.style.marginRight=fitted?'auto':'16px';const scale=fitted?Math.min(1,stage.clientWidth/width):1;frame.style.width=width+'px';frame.style.height=height+'px';frame.style.transform='scale('+scale+')';stage.style.height=Math.ceil(height*scale)+'px';}document.querySelector('#screen-size').addEventListener('change',resizeReview);document.querySelector('#fit-review').addEventListener('change',resizeReview);document.querySelector('#review-page').addEventListener('change',event=>frame.src=event.target.value);new ResizeObserver(resizeReview).observe(stage);resizeReview();</script></body></html>
